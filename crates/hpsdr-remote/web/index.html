<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>hpsdr-remote</title>
  <!-- hpsdr-rs's own web server fills in the path it passes the client's
       connection through to TCI at (web_server.rs); left as is, the page
       wasn't served by hpsdr-rs. -->
  <meta name="hpsdr-tci-path" content="__HPSDR_SERVED__">
  <!-- The client follows the browser's dark/light setting (egui reads
       prefers-color-scheme and follows changes); the page behind it, and a
       phone's browser bar, match egui's panel colour in each. -->
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#1b1b1b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8f8f8" media="(prefers-color-scheme: light)">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1b1b1b; }
    @media (prefers-color-scheme: light) { html, body { background: #f8f8f8; } }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="hpsdr_remote"></canvas>
  <script type="module">
    // A fresh query string on every load, so a browser (mobile ones
    // especially) can't keep running an old copy after a rebuild.
    const v = Date.now();
    const { default: init } = await import(`./pkg/hpsdr-remote.js?v=${v}`);
    await init({ module_or_path: `./pkg/hpsdr-remote_bg.wasm?v=${v}` });
  </script>
</body>
</html>
