<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>hpsdr-remote</title>
  <!-- hpsdr-rs's own web server fills in its TCI port here (web_server.rs). -->
  <meta name="hpsdr-tci-port" content="__TCI_PORT__">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1b1b1b; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="hpsdr_remote"></canvas>
  <script type="module">
    // A fresh query string on every load, so a browser (mobile ones
    // especially) can't keep running an old copy after a rebuild.
    const v = Date.now();
    const { default: init } = await import(`./pkg/hpsdr-remote.js?v=${v}`);
    await init({ module_or_path: `./pkg/hpsdr-remote_bg.wasm?v=${v}` });
  </script>
</body>
</html>
