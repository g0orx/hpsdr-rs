name: Linux packages

# Builds the Linux AppImages (scripts/build-appimage.sh) and RPMs
# (scripts/build-rpm.sh) for x86_64 and aarch64. Every run keeps them as
# workflow artifacts; a pushed v* tag also attaches them to that GitHub
# release. The RPM is then installed and its libraries checked on real
# Fedora and openSUSE Tumbleweed containers.
#
# Built on Ubuntu 22.04 on purpose: both formats need a glibc at least
# as new as the build machine's, so the oldest supported runner gives
# the widest reach (Ubuntu 22.04, Debian 12, Pi OS Bookworm, Fedora,
# openSUSE and newer).
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfftw3-dev libasound2-dev curl file
          cargo install cargo-generate-rpm --locked

      - name: Build AppImage
        run: scripts/build-appimage.sh

      - name: Build RPM
        run: scripts/build-rpm.sh

      - name: Collect packages
        run: |
          mkdir dist
          mv hpsdr-rs-*.AppImage target/generate-rpm/*.rpm dist/
          ls -l dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ runner.arch }}
          path: dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

  rpm-install-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:latest
            install: dnf install -y ./*.rpm
          - image: opensuse/tumbleweed
            install: zypper --non-interactive install --allow-unsigned-rpm ./*.rpm
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages-X64

      - name: Install RPM
        run: ${{ matrix.install }}

      - name: Check installed files and libraries
        run: |
          rpm -qi hpsdr-rs
          rpm -qR hpsdr-rs
          test -x /usr/bin/hpsdr-rs
          test -f /usr/share/hpsdr-rs/rx888/SDDC_FX3.img
          test -f /usr/share/hpsdr-rs/ozy/Ozy_Janus.rbf
          if ldd /usr/bin/hpsdr-rs | grep 'not found'; then exit 1; fi
