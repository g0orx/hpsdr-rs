[package]
name = "hpsdr-rs"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
authors = ["John Melton <john.d.melton@googlemail.com>"]
description = "Desktop client for openHPSDR Protocol 1/2 SDR radios"
repository = "https://github.com/g0orx/hpsdr-rs"

[dependencies]
# default-features disabled specifically to drop "accesskit" (Linux
# screen-reader/AT-SPI support via egui-winit -> accesskit_unix ->
# zbus/atspi -> the `polling` crate's epoll wait loop) -- confirmed via
# `perf record -g` that this D-Bus event loop was the actual source of
# one CPU core sitting pegged near 100% (polling::epoll::Poller::
# wait_deadline was ~80% of all captured samples), a known issue with
# accesskit's AT-SPI integration busy-polling even with no assistive
# technology active, especially under GNOME's always-running AT-SPI
# registry daemon. This app has no accessibility/screen-reader use
# case, so there's no downside to dropping it. The rest of this list
# is eframe 0.35's own default feature set, copied verbatim minus
# "accesskit" -- keep in sync if eframe's defaults ever change.
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "wayland",
    "web_screen_reader",
    "wgpu",
    "x11",
] }
egui = "0.35"
network-interface = "1"
socket2 = { version = "0.5", features = ["all"] }
serde = { version = "1", features = ["derive"] }
cpal = "0.17"
serde_json = "1"
tungstenite = "0.29"

# NOTE: I could not compile-check this in the sandbox this was written in
# (no Rust toolchain available), so treat these version numbers as a
# starting point -- run `cargo update` / `cargo check` locally and adjust
# if crates.io has moved on since.

[build-dependencies]
# Compile WDSP/libspecbleach/rnnoise from vendored C source (see
# build.rs's own doc comment) instead of linking prebuilt platform-
# specific binaries -- needed for this to build on Windows at all.
cc = "1"
pkg-config = "0.3"
# Finds fftw3 via a local vcpkg install -- MSVC-target Windows builds
# only (see build.rs's fftw3-discovery doc comment for why pkg-config
# alone isn't enough there: pkg-config can find an MSVC-triplet vcpkg
# package, but the include/lib paths that comes back are exactly what
# you'd want anyway, so going through vcpkg's own crate directly is more
# robust than fighting pkg-config's cross-compilation guard and PATH
# resolution for what's ultimately the same vcpkg install).
vcpkg = "0.2"

# `cargo deb` (https://crates.io/crates/cargo-deb) reads this to build a
# .deb -- Linux only, hence no attempt to also cover Windows/macOS
# packaging here. `depends` is left as the default "$auto": cargo-deb runs
# dpkg-shlibdeps against the built binary to work out the real runtime
# shared-lib dependencies (libfftw3-3, libasound2, libx11-6/libwayland,
# etc.) rather than this list drifting out of sync by hand.
[package.metadata.deb]
maintainer = "John Melton <john.d.melton@googlemail.com>"
copyright = "2026, John Melton <john.d.melton@googlemail.com>"
license-file = ["LICENSE", "4"]
extended-description = """\
hpsdr-rs is a desktop client for openHPSDR Protocol 1 and Protocol 2 \
software-defined radios (Metis/Ozy-style and Hermes/Orion-style boards, \
including the ANAN series), using WDSP for DSP. \
Features include spectrum/waterfall display, multiple simultaneous \
receivers, PureSignal PA linearization, diversity reception, a graphic \
equalizer, and rigctl/TCI control servers for use with WSJT-X and similar \
digital-mode software."""
section = "hamradio"
priority = "optional"
assets = [
    ["target/release/hpsdr-rs", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/hpsdr-rs/README.md", "644"],
    ["docs/manual/*.md", "usr/share/doc/hpsdr-rs/manual/", "644"],
    ["docs/manual/images/*", "usr/share/doc/hpsdr-rs/manual/images/", "644"],
    ["assets/hpsdr-rs.desktop", "usr/share/applications/hpsdr-rs.desktop", "644"],
    ["assets/icons/hpsdr-rs.png", "usr/share/icons/hicolor/256x256/apps/hpsdr-rs.png", "644"],
]
