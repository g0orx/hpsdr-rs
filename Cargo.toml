[package]
name = "hpsdr-rs"
version = "0.2.0"
edition = "2021"
license = "GPL-2.0-or-later"
authors = ["John Melton <john.d.melton@googlemail.com>"]
description = "Desktop client for openHPSDR Protocol 1/2 SDR radios"
repository = "https://github.com/g0orx/hpsdr-rs"

[dependencies]
# default-features disabled specifically to drop "accesskit" (Linux
# screen-reader/AT-SPI support via egui-winit -> accesskit_unix ->
# zbus/atspi -> the `polling` crate's epoll wait loop) -- confirmed via
# `perf record -g` that this D-Bus event loop was the actual source of
# one CPU core sitting pegged near 100% (polling::epoll::Poller::
# wait_deadline was ~80% of all captured samples), a known issue with
# accesskit's AT-SPI integration busy-polling even with no assistive
# technology active, especially under GNOME's always-running AT-SPI
# registry daemon. This app has no accessibility/screen-reader use
# case, so there's no downside to dropping it. The rest of this list
# is eframe 0.35's own default feature set, copied verbatim minus
# "accesskit" -- keep in sync if eframe's defaults ever change.
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "wayland",
    "web_screen_reader",
    "wgpu",
    "x11",
] }
egui = "0.35"
network-interface = "1"
socket2 = { version = "0.5", features = ["all"] }
serde = { version = "1", features = ["derive"] }
cpal = "0.17"
serde_json = "1"
tungstenite = "0.29"
# Raw Ethernet send/receive for the P1 bootloader-mode firmware-upload
# protocol (see bootloader.rs's own doc comment) -- NOT the same thing as
# ordinary UDP discovery/radio traffic elsewhere in this project. Chosen
# over hand-rolled libc/socket2 AF_PACKET because that's Linux-only;
# pnet_datalink has its own per-platform backend (raw AF_PACKET on Linux,
# direct /dev/bpf* on macOS, Npcap's WinPcap-compatible mode on Windows --
# see build.rs/README for the Npcap SDK requirement that adds to Windows
# builds specifically). Default features are already just "std" -- the
# optional "pcap"/"netmap"/"netmap_sys" backends and "serde" are opt-in,
# not default, so no feature overrides needed.
pnet_datalink = "0.35.0"
# Native file-open dialog, for picking a .rbf firmware file (bootloader.rs/
# bootloader_ui.rs) -- nothing else in this project has needed one before.
# Default features already use the xdg-portal backend on Linux (no GTK/
# glib/gobject pulled in -- "gtk3" is opt-in, not default), matching this
# project's existing GTK-avoidance elsewhere (see eframe's own feature list
# above -- no GTK anywhere in this app), so no feature overrides needed.
rfd = "0.17.2"
# USB I/O for the original Ozy/Metis-predecessor hardware (ozy.rs) --
# the classic Ozy+Mercury+Penny board set talks Protocol 1 over raw USB
# bulk transfers instead of UDP. Chosen over `rusb` (the libusb-1.0
# wrapper) deliberately: rusb needs the actual libusb-1.0 C library
# present at build+link+run time, a NEW system dependency on every
# platform, right after this project worked through real system-
# dependency pain getting Windows (Npcap SDK, MSVC+vcpkg) and macOS
# (Homebrew fftw3) building cleanly -- see README's Building section.
# `nusb` talks to the OS USB stack directly (usbfs on Linux, IOKit on
# macOS, WinUSB on Windows) with no C library at all. Its transfer
# methods return nusb's own `MaybeFuture`, resolved synchronously via
# `.wait()` (no tokio/async runtime pulled in), matching this codebase's
# existing thread-per-loop style everywhere else. Windows still needs a
# WinUSB driver bound to the Ozy VID:PID via Zadig regardless of crate
# choice (a Windows driver-model fact, not a libusb-specific one) --
# see README's Ozy USB section.
nusb = "0.2"

# NOTE: I could not compile-check this in the sandbox this was written in
# (no Rust toolchain available), so treat these version numbers as a
# starting point -- run `cargo update` / `cargo check` locally and adjust
# if crates.io has moved on since.

[build-dependencies]
# Compile WDSP/libspecbleach/rnnoise from vendored C source (see
# build.rs's own doc comment) instead of linking prebuilt platform-
# specific binaries -- needed for this to build on Windows at all.
cc = "1"
pkg-config = "0.3"
# Finds fftw3 via a local vcpkg install -- MSVC-target Windows builds
# only (see build.rs's fftw3-discovery doc comment for why pkg-config
# alone isn't enough there: pkg-config can find an MSVC-triplet vcpkg
# package, but the include/lib paths that comes back are exactly what
# you'd want anyway, so going through vcpkg's own crate directly is more
# robust than fighting pkg-config's cross-compilation guard and PATH
# resolution for what's ultimately the same vcpkg install).
vcpkg = "0.2"

# `cargo deb` (https://crates.io/crates/cargo-deb) reads this to build a
# .deb -- Linux only, hence no attempt to also cover Windows/macOS
# packaging here. `depends` is left as the default "$auto": cargo-deb runs
# dpkg-shlibdeps against the built binary to work out the real runtime
# shared-lib dependencies (libfftw3-3, libasound2, libx11-6/libwayland,
# etc.) rather than this list drifting out of sync by hand.
[package.metadata.deb]
maintainer = "John Melton <john.d.melton@googlemail.com>"
copyright = "2026, John Melton <john.d.melton@googlemail.com>"
license-file = ["LICENSE", "4"]
extended-description = """\
hpsdr-rs is a desktop client for openHPSDR Protocol 1 and Protocol 2 \
software-defined radios (Metis/Ozy-style and Hermes/Orion-style boards, \
including the ANAN series), using WDSP for DSP. \
Features include spectrum/waterfall display, multiple simultaneous \
receivers, PureSignal PA linearization, diversity reception, a graphic \
equalizer, and rigctl/TCI control servers for use with WSJT-X and similar \
digital-mode software."""
section = "hamradio"
priority = "optional"
# Debian revision suffix (the "-N" after the crate version in the built
# .deb's filename/package version) -- defaults to "1" when unset.
# Bump this on its own, independent of [package]'s `version` above,
# whenever a new .deb needs to be built and installed over an existing
# one without changing the crate's own version number: dpkg/apt only
# treats a new package as an upgrade if ITS version string (crate
# version + this revision) actually differs from what's installed, so
# reusing the same version+revision needs a manual `dpkg -r` first.
revision = "2"
assets = [
    ["target/release/hpsdr-rs", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/hpsdr-rs/README.md", "644"],
    ["docs/manual/*.md", "usr/share/doc/hpsdr-rs/manual/", "644"],
    ["docs/manual/images/*", "usr/share/doc/hpsdr-rs/manual/images/", "644"],
    ["assets/hpsdr-rs.desktop", "usr/share/applications/hpsdr-rs.desktop", "644"],
    ["assets/icons/hpsdr-rs.png", "usr/share/icons/hicolor/256x256/apps/hpsdr-rs.png", "644"],
    # Not auto-installed to /etc/udev/rules.d/ (a .deb shouldn't silently
    # install udev rules without the user's say-so) -- shipped as a
    # reference copy alongside the docs, see README's Ozy USB section
    # for the install command.
    ["assets/90-ozy.rules", "usr/share/doc/hpsdr-rs/90-ozy.rules", "644"],
    # Ozy's FX2 firmware + FPGA bitstream -- sourced from the author's
    # own piHPSDR repo (github.com/g0orx/pihpsdr), same GPL-2.0 license
    # as this project, not a third-party blob. Installed to
    # usr/share/hpsdr-rs/ozy/ specifically -- ozy.rs's `bundled_path`
    # derives this exact location from the installed binary's own path
    # (usr/bin/hpsdr-rs -> ../share/hpsdr-rs/ozy/), so a .deb install
    # needs no manual Ozy firmware/FPGA setup at all, only the udev rule.
    ["assets/ozy/ozyfw-sdr1k.hex", "usr/share/hpsdr-rs/ozy/ozyfw-sdr1k.hex", "644"],
    ["assets/ozy/Ozy_Janus.rbf", "usr/share/hpsdr-rs/ozy/Ozy_Janus.rbf", "644"],
]
